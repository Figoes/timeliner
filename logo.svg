<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Timeliner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="tlGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b1"/>
      <feGaussianBlur stdDeviation="7" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#tlGlow)">
    <!-- buitenring, open aan de rechterkant -->
    <path d="M 206 90 A 88 88 0 1 0 206 166" stroke="#ff1e8e" stroke-width="9"/>
    <!-- accentboog geel bovenlangs -->
    <path d="M 90 60 A 62 62 0 0 1 166 60" stroke="#ffd60a" stroke-width="5"/>

    <!-- tijdlijn, met een opening waar de kaart in komt -->
    <path d="M 64 154 H 108" stroke="#1fc7fb" stroke-width="6"/>
    <path d="M 148 154 H 192" stroke="#1fc7fb" stroke-width="6"/>

    <!-- geplaatste kaarten -->
    <rect x="66" y="120" width="18" height="34" rx="4" stroke="#1fc7fb" stroke-width="5"/>
    <rect x="92" y="120" width="18" height="34" rx="4" stroke="#1fc7fb" stroke-width="5"/>
    <rect x="146" y="120" width="18" height="34" rx="4" stroke="#1fc7fb" stroke-width="5"/>
    <rect x="172" y="120" width="18" height="34" rx="4" stroke="#1fc7fb" stroke-width="5"/>

    <!-- de kaart die geplaatst wordt -->
    <rect x="114" y="96" width="26" height="40" rx="5" fill="#151628" stroke="#ffd60a" stroke-width="6"/>
    <path d="M 118 148 L 127 157 L 136 148" stroke="#ffd60a" stroke-width="5"/>
  </g>
</svg>
